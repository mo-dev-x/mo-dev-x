<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 84" width="64" height="64" role="img" aria-label="Blitz 2027 Bot">
  <title>Blitz 2027 Bot</title>
  <desc>A comet falling onto a target tile of a small grid, beside the Blitz 2027 Bot wordmark.</desc>
  <defs>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd43b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sky"><rect x="1" y="1" width="82" height="82" rx="19"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="83" height="83" rx="20" fill="#161b22" stroke="#30363d"/>
  <g>
    <rect x="20" y="41" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.16"/>
    <rect x="32" y="41" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.16"/>
    <rect x="44" y="41" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.16"/>
    <rect x="56" y="41" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.16"/>
    <rect x="20" y="53" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.26"/>
    <rect x="32" y="53" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.26"/>
    <rect x="44" y="53" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.26"/>
    <rect x="56" y="53" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.26"/>
    <rect x="20" y="65" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.38"/>
    <rect x="32" y="65" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.38"/>
    <rect x="44" y="65" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.38"/>
    <rect x="56" y="65" width="9.5" height="9.5" rx="2" fill="#8b949e" fill-opacity="0.38"/>
  </g>
  <rect class="hit" x="44" y="41" width="9.5" height="9.5" rx="2" fill="none" stroke="#ff8a3d" stroke-width="1.6"/>
  <g clip-path="url(#sky)">
    <g class="comet">
      <g class="tail">
        <path d="M24 9 L46.6 34.6 L50.4 30.8 Z" fill="url(#tail)"/>
        <path d="M34 9 L48 26.5 L51 23.5 Z" fill="url(#tail)" opacity="0.55"/>
      </g>
      <circle cx="49.5" cy="33.5" r="8" fill="url(#glow)"/>
      <circle cx="49.5" cy="33.5" r="4.4" fill="#ff8a3d"/>
      <circle cx="48.2" cy="32.2" r="1.4" fill="#ffe8cc"/>
    </g>
  </g>
